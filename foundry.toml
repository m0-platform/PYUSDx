[profile.default]
evm_version = "cancun"
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./safe" },
]
gas_reports = ["*"]
gas_reports_ignore = []
ignored_error_codes = []
optimizer = true
optimizer_runs = 2933
solc_version = "0.8.34"
verbosity = 3

[lint]
lint_on_build = false

[profile.production]
build_info = true
sizes = true

[fuzz]
runs = 5_000

[invariant]
runs = 512            # The number of calls to make in the invariant tests
depth = 25            # The number of times to run the invariant tests
fail_on_revert = true # Fail the test if the contract reverts

[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 250

[rpc_endpoints]
localhost = "${LOCALHOST_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
monad = "${MONAD_RPC_URL}"

sepolia = "${SEPOLIA_RPC_URL}"
arbitrum-sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
monad-testnet = "${MONAD_TESTNET_RPC_URL}"

etherscan_api_key = "${ETHERSCAN_API_KEY}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", url = "${MAINNET_VERIFIER_URL}" }
arbitrum = { key = "${ETHERSCAN_API_KEY}", url = "${ARBITRUM_VERIFIER_URL}" }
# `chain` is set explicitly because foundry's chain registry does not map the `monad` alias.
monad = { key = "${ETHERSCAN_API_KEY}", url = "${MONAD_VERIFIER_URL}", chain = 143 }

sepolia = { key = "${ETHERSCAN_API_KEY}", url = "${SEPOLIA_VERIFIER_URL}" }
arbitrum-sepolia = { key = "${ETHERSCAN_API_KEY}", url = "${ARBITRUM_SEPOLIA_VERIFIER_URL}" }
monad-testnet = { key = "${ETHERSCAN_API_KEY}", url = "${MONAD_TESTNET_VERIFIER_URL}", chain = 10143 }

# See more config options at https://github.com/foundry-rs/foundry/tree/master/crates/config
